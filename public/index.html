<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NADA</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#121212;--bg2:#181818;--bg3:#242424;--surface:#282828;--surface2:#3e3e3e;
  --green:#1db954;--white:#fff;--muted:#b3b3b3;--muted2:#6a6a6a;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Figtree',sans-serif;color:#fff;display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#535353;border-radius:99px}

/* ── TOP NAV ── */
#topnav{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:var(--bg);flex-shrink:0;position:sticky;top:0;z-index:50}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e8115b,#c62a2a);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-right:2px;cursor:pointer}
.nav-pill{padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:background .15s,color .15s;white-space:nowrap;font-family:'Figtree',sans-serif}
.nav-pill.active{background:#fff;color:#000}
.nav-pill:not(.active){background:var(--surface);color:#fff}

/* ── SEARCH BAR ── */
#searchBar{padding:0 16px 12px;display:none;flex-shrink:0}
#searchBar.show{display:block}
.s-inner{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;padding:11px 14px}
.s-inner svg{color:var(--muted);flex-shrink:0}
#sInput{flex:1;background:none;border:none;outline:none;color:#fff;font-family:'Figtree',sans-serif;font-size:15px}
#sInput::placeholder{color:var(--muted)}

/* ── SCROLL ── */
#scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.pg{display:none;padding-bottom:8px}
.pg.on{display:block}

/* ── QUICK GRID ── */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 16px 4px}
.qi{display:flex;align-items:center;gap:0;background:var(--surface);border-radius:6px;overflow:hidden;cursor:pointer;height:56px;transition:background .15s}
.qi:hover,.qi:active{background:#3a3a3a}
.qi img{width:56px;height:56px;object-fit:cover;flex-shrink:0}
.qi-t{font-size:13px;font-weight:600;padding:0 10px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── SECTION TITLE ── */
.stitle{font-size:22px;font-weight:700;padding:24px 16px 14px}

/* ── CARD ROW ── */
.hrow{overflow-x:auto;padding:0 16px 4px}
.hrow::-webkit-scrollbar{height:0}
.hinner{display:flex;gap:14px;width:max-content}
.card{width:148px;cursor:pointer;flex-shrink:0}
.card-img{position:relative;border-radius:8px;overflow:hidden;margin-bottom:10px}
.card-img img{width:148px;height:148px;object-fit:cover;display:block;background:var(--surface)}
.card-img::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
.card:hover .card-img::after{opacity:1}
.card-play-btn{position:absolute;bottom:8px;right:8px;z-index:2;width:46px;height:46px;border-radius:50%;background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card:hover .card-play-btn{opacity:1;transform:translateY(0)}
.card-play-btn svg{color:#000;margin-left:2px}
.card-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-a{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── TRACK LIST ── */
.tlist{padding:0 16px}
.ti{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.ti:hover,.ti:active{background:rgba(255,255,255,.06)}
.ti.on .ti-title{color:var(--green)}
.ti-n{width:20px;text-align:center;font-size:14px;color:var(--muted);flex-shrink:0}
.ti-img{width:48px;height:48px;border-radius:4px;object-fit:cover;background:var(--surface);flex-shrink:0}
.ti-info{flex:1;min-width:0}
.ti-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-art{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-dot{color:var(--muted);padding:4px;opacity:0;transition:opacity .15s;background:none;border:none;cursor:pointer;color:var(--muted)}
.ti:hover .ti-dot{opacity:1}

/* ── LIBRARY ── */
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
.lib-head h1{font-size:22px;font-weight:700}
.lib-icons{display:flex;gap:14px}
.ib{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center}
.ltabs{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto}
.ltabs::-webkit-scrollbar{height:0}
.ltab{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;font-family:'Figtree',sans-serif;transition:background .15s}
.ltab.on{background:#fff;color:#000}
.ltab:not(.on){background:var(--surface);color:#fff}
.lsort{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.lsort-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Figtree',sans-serif}
.lview{background:none;border:none;color:var(--muted);cursor:pointer}
.llib{padding:0 16px}
.litem{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer;border-radius:6px;transition:background .12s}
.litem:hover,.litem:active{background:rgba(255,255,255,.05);padding-left:8px;padding-right:8px;margin:0 -8px}
.lthumb{width:52px;height:52px;flex-shrink:0;object-fit:cover;border-radius:6px;background:var(--surface)}
.lthumb.circle{border-radius:50%}
.lheart{width:52px;height:52px;border-radius:6px;background:linear-gradient(135deg,#450af5,#c4efd9);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.linfo{flex:1;min-width:0}
.l-t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-s{font-size:13px;color:var(--muted);margin-top:2px}

/* ── BROWSE ── */
.btitle{font-size:22px;font-weight:700;padding:20px 16px 14px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.bcat{border-radius:8px;height:100px;position:relative;cursor:pointer;overflow:hidden;transition:transform .15s}
.bcat:hover,.bcat:active{transform:scale(.96)}
.bcat-label{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;font-size:15px;font-weight:700;background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}

/* ── SEARCH RESULT ── */
.res-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.res-head h2{font-size:20px;font-weight:700}
.res-count{font-size:13px;color:var(--muted)}

/* ══ MINI PLAYER ══ */
#mp{flex-shrink:0;padding:0 8px 8px;display:none}
#mp.show{display:block}
.mp-wrap{background:#1f1f1f;border-radius:12px;display:flex;align-items:center;gap:10px;padding:10px 12px 14px;position:relative;overflow:hidden;cursor:pointer}
.mp-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px) saturate(1.5);opacity:.22;pointer-events:none;transition:background-image .5s}
.mp-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;position:relative;z-index:1;background:var(--surface)}
.mp-info{flex:1;min-width:0;position:relative;z-index:1}
.mp-t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-a{font-size:12px;color:var(--muted);margin-top:1px}
.mp-ctrls{display:flex;align-items:center;gap:4px;position:relative;z-index:1}
.mpb{background:none;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;transition:transform .1s}
.mpb:active{transform:scale(.85)}
.mpb.play{width:36px;height:36px;background:#fff;border-radius:50%;justify-content:center;color:#000}
.mp-prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.12)}
.mp-fill{height:100%;background:#fff;width:0%;transition:width .5s linear;border-radius:99px}

/* ══ FULL PLAYER ══ */
#fp{position:fixed;inset:0;z-index:300;background:#000;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
#fp.open{transform:translateY(0)}
.fp-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(70px) saturate(1.8);opacity:.38;pointer-events:none;transition:background-image .5s}
.fp-dim{position:absolute;inset:0;background:rgba(0,0,0,.58);pointer-events:none}
.fp-drag{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:36px;height:4px;background:rgba(255,255,255,.28);border-radius:99px}
.fp-top{display:flex;align-items:center;justify-content:space-between;padding:50px 20px 14px;position:relative;z-index:1}
.fp-close{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center}
.fp-ctx{font-size:11px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.fp-more{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center}
.fp-art{flex:1;display:flex;align-items:center;justify-content:center;padding:0 32px;position:relative;z-index:1}
.fp-art img{width:100%;max-width:320px;aspect-ratio:1;border-radius:8px;object-fit:cover;box-shadow:0 28px 60px rgba(0,0,0,.75);transition:transform .35s}
#fp.playing .fp-art img{transform:scale(1.06)}
.fp-meta{display:flex;align-items:center;justify-content:space-between;padding:4px 24px 6px;position:relative;z-index:1}
.fp-ml{flex:1;min-width:0}
#fp-title{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fp-artist{font-size:15px;color:var(--muted);margin-top:3px}
.fp-heart{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:flex;align-items:center;transition:color .15s}
.fp-heart.liked{color:var(--green)}
.fp-prog-area{padding:0 24px 12px;position:relative;z-index:1}
#fp-bar{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:rgba(255,255,255,.28);outline:none;cursor:pointer}
#fp-bar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#fff;border-radius:50%}
.fp-times{display:flex;justify-content:space-between;margin-top:6px}
.fp-times span{font-size:11px;color:var(--muted)}
.fp-ctrls{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;position:relative;z-index:1}
.fpc{background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;display:flex;align-items:center;transition:color .15s}
.fpc:hover{color:#fff}
.fpc.on{color:var(--green)}
.fp-playbtn{width:64px;height:64px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;color:#000;transition:transform .1s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.fp-playbtn:active{transform:scale(.92)}
.fp-ext{display:flex;align-items:center;justify-content:space-between;padding:0 24px 28px;position:relative;z-index:1}
.fpex{background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;display:flex;align-items:center}

/* ── BOTTOM NAV ── */
#bnav{flex-shrink:0;display:flex;align-items:center;background:var(--bg2);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;color:var(--muted);border:none;background:none;font-family:'Figtree',sans-serif;transition:color .15s}
.bni.on{color:#fff}
.bni span{font-size:10px;font-weight:600}

/* ── SKELETON ── */
.sk{background:linear-gradient(90deg,var(--surface) 25%,var(--bg3) 50%,var(--surface) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:4px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fuUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fu{animation:fuUp .3s ease both}
.empty-msg{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.8}
.empty-msg b{display:block;color:#fff;font-size:17px;margin-bottom:6px}
</style>
</head>
<body>

<!-- TOP NAV -->
<div id="topnav">
  <div class="nav-avatar">F</div>
  <button class="nav-pill active" id="pill-semua" onclick="pilNav('semua',this)">Semua</button>
  <button class="nav-pill" id="pill-musik" onclick="pilNav('musik',this)">Musik</button>
  <button class="nav-pill" id="pill-podcast" onclick="pilNav('podcast',this)">Podcast</button>
</div>

<!-- SEARCH BAR -->
<div id="searchBar">
  <div class="s-inner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="sInput" type="text" placeholder="Apa yang ingin kamu dengarkan?" autocomplete="off"/>
  </div>
</div>

<!-- MAIN SCROLL -->
<div id="scroll">

  <!-- HOME -->
  <div id="pgHome" class="pg on">
    <div class="qgrid" id="qGrid"></div>
    <div id="homeSec"></div>
  </div>

  <!-- SEARCH -->
  <div id="pgSearch" class="pg">
    <div id="searchContent">
      <p class="btitle">Jelajahi semua</p>
      <div class="bgrid">
        <div class="bcat" style="background:#e8115b" onclick="qs('pop indonesia')"><div class="bcat-label">Pop</div></div>
        <div class="bcat" style="background:#ba5d07" onclick="qs('hip hop indonesia')"><div class="bcat-label">Hip-Hop</div></div>
        <div class="bcat" style="background:#0d73ec" onclick="qs('indie indonesia')"><div class="bcat-label">Indie</div></div>
        <div class="bcat" style="background:#1db954" onclick="qs('lagu santai relaksasi')"><div class="bcat-label">Relaksasi</div></div>
        <div class="bcat" style="background:#8d67ab" onclick="qs('rnb indonesia')"><div class="bcat-label">R&amp;B</div></div>
        <div class="bcat" style="background:#c62a2a" onclick="qs('rock indonesia')"><div class="bcat-label">Rock</div></div>
        <div class="bcat" style="background:#477d95" onclick="qs('jazz indonesia')"><div class="bcat-label">Jazz</div></div>
        <div class="bcat" style="background:#c87941" onclick="qs('dangdut')"><div class="bcat-label">Dangdut</div></div>
      </div>
    </div>
  </div>

  <!-- LIBRARY -->
  <div id="pgLib" class="pg">
    <div class="lib-head">
      <h1>Koleksi Kamu</h1>
      <div class="lib-icons">
        <button class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="ib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
    </div>
    <div class="ltabs">
      <button class="ltab on" onclick="libTab(this,'pl')">Playlist</button>
      <button class="ltab" onclick="libTab(this,'ar')">Artis</button>
    </div>
    <div class="lsort">
      <button class="lsort-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></svg>
        Terakhir
      </button>
      <button class="lview"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
    </div>
    <div class="llib" id="libList"></div>
  </div>

</div><!-- /scroll -->

<!-- MINI PLAYER -->
<div id="mp">
  <div class="mp-wrap" onclick="openFP()">
    <div class="mp-bg" id="mpBg"></div>
    <img class="mp-thumb" id="mpThumb" src="" alt=""/>
    <div class="mp-info">
      <div class="mp-t" id="mpT">—</div>
      <div class="mp-a" id="mpA"></div>
    </div>
    <div class="mp-ctrls">
      <button class="mpb" onclick="event.stopPropagation();doLike()" id="mpLike">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="mpb play" id="mpPlay" onclick="event.stopPropagation();tog()">
        <svg id="mpI" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mpb" onclick="event.stopPropagation();nx()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 8.5 6V6z"/></svg>
      </button>
    </div>
    <div class="mp-prog"><div class="mp-fill" id="mpFill"></div></div>
  </div>
</div>

<!-- FULL PLAYER -->
<div id="fp">
  <div class="fp-bg" id="fpBg"></div>
  <div class="fp-dim"></div>
  <div class="fp-drag"></div>
  <div class="fp-top">
    <button class="fp-close" onclick="closeFP()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
    <span class="fp-ctx">Direkomendasikan Untukmu</span>
    <button class="fp-more"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
  </div>
  <div class="fp-art"><img id="fpArt" src="" alt=""/></div>
  <div class="fp-meta">
    <div class="fp-ml">
      <div id="fp-title" style="font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
      <div id="fp-artist" style="font-size:15px;color:var(--muted);margin-top:3px"></div>
    </div>
    <button class="fp-heart" id="fpHeart" onclick="doLike()">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>
  <div class="fp-prog-area">
    <input type="range" id="fp-bar" min="0" max="100" value="0"/>
    <div class="fp-times"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
  </div>
  <div class="fp-ctrls">
    <button class="fpc" id="btnShuffle" onclick="toggleShuffle()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
    <button class="fpc" onclick="pv()"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="fp-playbtn" id="fpPlay" onclick="tog()"><svg id="fpI" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="fpc" onclick="nx()"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 8.5 6V6z"/></svg></button>
    <button class="fpc" id="btnRepeat" onclick="toggleRepeat()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
  <div class="fp-ext">
    <button class="fpex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="3" height="10" rx="1"/><rect x="10.5" y="6" width="3" height="15" rx="1"/><rect x="18" y="3" width="3" height="18" rx="1"/></svg></button>
    <button class="fpex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
    <button class="fpex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="bnav">
  <button class="bni on" id="bn0" onclick="goPage('Home','bn0')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </button>
  <button class="bni" id="bn1" onclick="goPage('Search','bn1')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Cari</span>
  </button>
  <button class="bni" id="bn2" onclick="goPage('Lib','bn2')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <span>Koleksi Kamu</span>
  </button>
</div>

<div id="ytH" style="display:none;position:absolute;width:0;height:0;overflow:hidden"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ─── CONFIG ───
const API=window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1'?'http://localhost:8000':'';

// ─── STATE ───
let queue=[],cur=-1,playing=false;
let yt=null,ytOk=false;
let shuf=false,rep=false;
let liked=new Set();
let ptimer=null,homeData=null;
let curPage='Home';

// ─── YT ───
function onYouTubeIframeAPIReady(){
  yt=new YT.Player('ytH',{height:'0',width:'0',playerVars:{autoplay:1},events:{
    onReady:()=>{ytOk=true;yt.setVolume(80)},
    onStateChange:e=>{
      if(e.data===YT.PlayerState.PLAYING){playing=true;setUI(true);startP()}
      else if(e.data===YT.PlayerState.PAUSED){playing=false;setUI(false);stopP()}
      else if(e.data===YT.PlayerState.ENDED){rep?(yt.seekTo(0),yt.playVideo()):nx()}
    }
  }});
}

function play(i){
  if(!ytOk){setTimeout(()=>play(i),500);return}
  if(i<0||i>=queue.length)return;
  cur=i;const t=queue[i];
  updUI(t);yt.loadVideoById(t.videoId);playing=true;setUI(true);hilite();
}
function tog(){if(cur<0)return;playing?yt.pauseVideo():yt.playVideo()}
function nx(){if(!queue.length)return;play(shuf?Math.floor(Math.random()*queue.length):(cur+1)%queue.length)}
function pv(){if(!queue.length)return;const ct=yt?.getCurrentTime?.()||0;ct>3?(yt.seekTo(0)):play((cur-1+queue.length)%queue.length)}

function startP(){
  stopP();
  ptimer=setInterval(()=>{
    if(!yt||!ytOk)return;
    const c=yt.getCurrentTime?.()||0,d=yt.getDuration?.()||0;
    if(d>0){
      const p=(c/d)*100;
      document.getElementById('fp-bar').value=p;
      document.getElementById('mpFill').style.width=p+'%';
      document.getElementById('fpCur').textContent=ft(c);
      document.getElementById('fpDur').textContent=ft(d);
    }
  },600);
}
function stopP(){clearInterval(ptimer)}

document.getElementById('fp-bar').addEventListener('input',function(){
  if(!yt||!ytOk)return;
  yt.seekTo((this.value/100)*(yt.getDuration?.()||0),true);
});

function ft(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${sec.toString().padStart(2,'0')}`}

function updUI(t){
  document.getElementById('mpThumb').src=t.thumbnail;
  document.getElementById('mpT').textContent=t.title;
  document.getElementById('mpA').textContent=t.artist;
  document.getElementById('mpBg').style.backgroundImage=`url(${t.thumbnail})`;
  document.getElementById('mp').classList.add('show');
  document.getElementById('fpArt').src=t.thumbnail;
  document.getElementById('fp-title').textContent=t.title;
  document.getElementById('fp-artist').textContent=t.artist;
  document.getElementById('fpBg').style.backgroundImage=`url(${t.thumbnail})`;
  const lk=liked.has(t.videoId);
  const hrt=document.getElementById('fpHeart');
  hrt.classList.toggle('liked',lk);
  hrt.querySelector('svg').setAttribute('fill',lk?'#1db954':'none');
  hrt.querySelector('svg').setAttribute('stroke',lk?'#1db954':'currentColor');
  document.title=t.title+' — NADA';
}

function setUI(p){
  const ic=p?'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>':'<path d="M8 5v14l11-7z"/>';
  document.getElementById('mpI').innerHTML=ic;
  document.getElementById('fpI').innerHTML=ic;
  document.getElementById('fp').classList.toggle('playing',p);
}

function hilite(){
  document.querySelectorAll('.ti').forEach(el=>el.classList.toggle('on',parseInt(el.dataset.i)===cur));
}

function openFP(){if(cur<0)return;document.getElementById('fp').classList.add('open')}
function closeFP(){document.getElementById('fp').classList.remove('open')}

// swipe down close
(()=>{let sy=0;const f=document.getElementById('fp');f.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});f.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy>80)closeFP()},{passive:true})})();

function doLike(){
  if(cur<0)return;
  const t=queue[cur];
  liked.has(t.videoId)?liked.delete(t.videoId):liked.add(t.videoId);
  updUI(t);
}
function toggleShuffle(){shuf=!shuf;document.getElementById('btnShuffle').classList.toggle('on',shuf)}
function toggleRepeat(){rep=!rep;document.getElementById('btnRepeat').classList.toggle('on',rep)}

// ─── PAGES ───
function goPage(name,bnId){
  curPage=name;
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.getElementById('pg'+name).classList.add('on');
  document.querySelectorAll('.bni').forEach(b=>b.classList.remove('on'));
  document.getElementById(bnId).classList.add('on');
  document.getElementById('searchBar').classList.toggle('show',name==='Search');
  document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
  if(name==='Home')document.getElementById('pill-semua').classList.add('active');
  if(name==='Search')document.getElementById('sInput').focus();
  if(name==='Lib')renderLib();
}

function pilNav(type,el){
  document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  if(type==='semua'||type==='musik'){
    goPage('Home',curPage==='Search'?'bn1':curPage==='Lib'?'bn2':'bn0');
    document.getElementById('bn0').classList.add('on');
  }
}

// ─── LIBRARY ───
function libTab(el,type){
  document.querySelectorAll('.ltab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderLib(type);
}

function renderLib(type='pl'){
  const list=document.getElementById('libList');
  list.innerHTML='';
  if(type==='pl'||type==='all'){
    const el=document.createElement('div');
    el.className='litem fu';
    el.innerHTML=`<div class="lheart"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="linfo"><div class="l-t">Lagu yang Disukai</div><div class="l-s">Playlist • ${liked.size} lagu</div></div>`;
    el.onclick=()=>qs('lagu hits indonesia 2025');
    list.appendChild(el);
  }
  if(homeData&&(type==='ar'||type==='all')){
    const arts=[...new Set((homeData.trending||[]).map(t=>t.artist))].slice(0,10);
    arts.forEach((a,i)=>{
      const th=(homeData.trending||[]).find(t=>t.artist===a)?.thumbnail||'';
      const el=document.createElement('div');
      el.className='litem fu';el.style.animationDelay=`${i*.04}s`;
      el.innerHTML=`<img class="lthumb circle" src="${th}" onerror="this.style.background='#333'" alt=""/><div class="linfo"><div class="l-t">${esc(a)}</div><div class="l-s">Artis</div></div>`;
      el.onclick=()=>{qs(a);goPage('Search','bn1')};
      list.appendChild(el);
    });
  }
}

// ─── HOME ───
async function loadHome(){
  skelHome();
  try{
    const r=await fetch(`${API}/api/home`);
    const {status,data,message}=await r.json();
    if(status!=='success')throw new Error(message);
    homeData=data;
    // build master queue
    queue=[];const seen=new Set();
    [...(data.recent||[]),...(data.trending||[]),...(data.chill||[]),...(data.galau||[])].forEach(t=>{
      if(!seen.has(t.videoId)){seen.add(t.videoId);queue.push(t)}
    });
    renderHome(data);
  }catch(e){
    document.getElementById('homeSec').innerHTML=`<div class="empty-msg"><b>Gagal memuat</b>Pastikan server berjalan di ${API}</div>`;
  }
}

function renderHome(d){
  // quick grid
  const qg=document.getElementById('qGrid');qg.innerHTML='';
  (d.trending||[]).slice(0,8).forEach((t,i)=>{
    const qi=queue.findIndex(q=>q.videoId===t.videoId);
    const el=document.createElement('div');el.className='qi fu';el.style.animationDelay=`${i*.04}s`;
    el.innerHTML=`<img src="${t.thumbnail}" alt="" onerror="this.style.background='#333'"/><span class="qi-t">${esc(t.title)}</span>`;
    el.onclick=()=>play(qi);qg.appendChild(el);
  });
  const sec=document.getElementById('homeSec');sec.innerHTML='';
  sec.appendChild(mkCards('Trending Sekarang',d.trending));
  sec.appendChild(mkCards('Santai &amp; Cafe',d.chill));
  sec.appendChild(mkTracks('Hits 2025',d.recent));
  sec.appendChild(mkCards('Lagu Galau',d.galau));
}

function mkCards(title,tracks){
  const w=document.createElement('div');
  w.innerHTML=`<div class="stitle">${title}</div><div class="hrow"><div class="hinner" id="hi-${Math.random().toString(36).slice(2)}"></div></div>`;
  const id=w.querySelector('.hinner').id;
  setTimeout(()=>{
    const l=w.querySelector(`#${id}`);
    (tracks||[]).forEach((t,i)=>{
      const qi=queue.findIndex(q=>q.videoId===t.videoId);
      const c=document.createElement('div');c.className='card fu';c.style.animationDelay=`${i*.03}s`;
      c.innerHTML=`<div class="card-img"><img src="${t.thumbnail}" loading="lazy" alt="" onerror="this.style.background='#333'"/><button class="card-play-btn" onclick="event.stopPropagation();play(${qi})"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div><div class="card-t">${esc(t.title)}</div><div class="card-a">${esc(t.artist)}</div>`;
      c.onclick=()=>play(qi);l.appendChild(c);
    });
  },0);
  return w;
}

function mkTracks(title,tracks){
  const w=document.createElement('div');
  const uid='tl-'+Math.random().toString(36).slice(2);
  w.innerHTML=`<div class="stitle">${title}</div><div class="tlist" id="${uid}"></div>`;
  setTimeout(()=>{
    const l=w.querySelector(`#${uid}`);
    (tracks||[]).forEach((t,i)=>{
      const qi=queue.findIndex(q=>q.videoId===t.videoId);
      const el=document.createElement('div');el.className='ti fu';el.dataset.i=qi;el.style.animationDelay=`${i*.03}s`;
      el.innerHTML=`<span class="ti-n">${i+1}</span><img class="ti-img" src="${t.thumbnail}" loading="lazy" alt="" onerror="this.style.background='#333'"/><div class="ti-info"><div class="ti-title">${esc(t.title)}</div><div class="ti-art">${esc(t.artist)}</div></div><button class="ti-dot" onclick="event.stopPropagation()"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>`;
      el.onclick=()=>play(qi);l.appendChild(el);
    });
  },0);
  return w;
}

function skelHome(){
  document.getElementById('qGrid').innerHTML=Array(8).fill(`<div style="display:flex;align-items:center;background:#282828;border-radius:6px;height:56px;overflow:hidden"><div class="sk" style="width:56px;height:56px;flex-shrink:0;border-radius:0"></div><div class="sk" style="height:12px;width:55%;margin-left:12px;border-radius:4px"></div></div>`).join('');
  document.getElementById('homeSec').innerHTML=`<div class="stitle" style="opacity:.3">&#8203;</div><div class="hrow"><div class="hinner">${Array(5).fill(`<div style="width:148px"><div class="sk" style="width:148px;height:148px;border-radius:8px;margin-bottom:10px"></div><div class="sk" style="height:12px;width:80%;margin-bottom:6px"></div><div class="sk" style="height:11px;width:55%"></div></div>`).join('')}</div></div>`;
}

// ─── SEARCH ───
async function doSearch(q){
  if(!q.trim())return;
  const sc=document.getElementById('searchContent');
  sc.innerHTML=`<div class="res-head"><h2>Mencari…</h2></div><div class="tlist">${Array(6).fill(`<div class="ti" style="pointer-events:none"><span class="ti-n"> </span><div class="sk" style="width:48px;height:48px;border-radius:4px;flex-shrink:0"></div><div class="ti-info"><div class="sk" style="height:13px;width:60%;margin-bottom:6px"></div><div class="sk" style="height:11px;width:40%"></div></div></div>`).join('')}</div>`;
  try{
    const r=await fetch(`${API}/api/search?query=${encodeURIComponent(q)}`);
    const {status,data,message}=await r.json();
    if(status!=='success')throw new Error(message);
    if(!data.length){sc.innerHTML=`<div class="empty-msg"><b>Tidak ditemukan</b>Coba kata kunci lain</div>`;return}
    data.forEach(t=>{if(!queue.find(q=>q.videoId===t.videoId))queue.push(t)});
    sc.innerHTML='';
    const hd=document.createElement('div');hd.className='res-head';hd.innerHTML=`<h2>${esc(q)}</h2><span class="res-count">${data.length} lagu</span>`;sc.appendChild(hd);
    const tl=document.createElement('div');tl.className='tlist';
    data.forEach((t,i)=>{
      const qi=queue.findIndex(qq=>qq.videoId===t.videoId);
      const el=document.createElement('div');el.className='ti fu';el.dataset.i=qi;el.style.animationDelay=`${i*.025}s`;
      el.innerHTML=`<span class="ti-n">${i+1}</span><img class="ti-img" src="${t.thumbnail}" loading="lazy" alt="" onerror="this.style.background='#333'"/><div class="ti-info"><div class="ti-title">${esc(t.title)}</div><div class="ti-art">${esc(t.artist)}</div></div><button class="ti-dot" onclick="event.stopPropagation()"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>`;
      el.onclick=()=>play(qi);tl.appendChild(el);
    });
    sc.appendChild(tl);
  }catch(e){sc.innerHTML=`<div class="empty-msg"><b>Error</b>${e.message}</div>`}
}

function qs(q){document.getElementById('sInput').value=q;goPage('Search','bn1');doSearch(q)}

document.getElementById('sInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(e.target.value)});
document.getElementById('sInput').addEventListener('input',e=>{if(e.target.value.length>2)clearTimeout(window._st),window._st=setTimeout(()=>doSearch(e.target.value),650)});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();tog()}
  if(e.code==='ArrowRight')nx();
  if(e.code==='ArrowLeft')pv();
  if(e.code==='Escape')closeFP();
});

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

loadHome();
</script>
</body>
</html>
